[project]
name = "edc-retinopathy"
version = "0.1.0"
description = "Retinopathy camera integration for clinicedc"
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
    "django-rest-framework>=0.1.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edc_retinopathy"]
