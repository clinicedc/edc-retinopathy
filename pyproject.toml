[project]
name = "edc-retinopathy"
version = "0.1.1"
description = "Retinopathy camera integration for clinicedc"
readme = "README.rst"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<6.1",
    "djangorestframework>=3.16.0",
]

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edc_retinopathy"]
